name: test-vapi
# Diagnóstico: llama a la Edge Function vapi-trigger y muestra la respuesta cruda.

on:
  workflow_dispatch:
    inputs:
      telefono:
        description: "Teléfono a llamar (formato libre)"
        required: true
        default: "8090000000"
        type: string
      nombreMascota:
        description: "Nombre de la mascota"
        required: false
        default: "Nicky De los Santos"
        type: string
      nombrePropietario:
        description: "Nombre del propietario"
        required: false
        default: "Fam. De los Santos"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a vapi-trigger
        run: |
          echo "=== Probando vapi-trigger ==="
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://ulrzzddovkioxeaarnjk.supabase.co/functions/v1/vapi-trigger" \
            -H "Content-Type: application/json" \
            -d '{
              "nombreMascota": "${{ github.event.inputs.nombreMascota }}",
              "nombrePropietario": "${{ github.event.inputs.nombrePropietario }}",
              "telefono": "${{ github.event.inputs.telefono }}",
              "motivo": "manual"
            }')
          echo "=== RESPUESTA ==="
          echo "$RESPONSE"
